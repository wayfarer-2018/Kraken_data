name: Update RRG Data

on:
  schedule:
    # Runs daily at 01:20 UTC, 20 minutes after the CSV update
    - cron: '20 1 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run RRG calculation script
        run: python rrg_calculator.py # Assumes your script is named this

      - name: Commit and push if there are changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add rrg_data.json
          # The following command will fail if there are no changes, which is fine.
          # The '|| exit 0' part ensures the workflow doesn't fail on no-change runs.
          git commit -m "Update RRG data" -a || exit 0
          git push
